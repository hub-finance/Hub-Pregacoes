<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="description" content="Bíblia, estudo, devocional, sermões e biblioteca ministerial em um só lugar." />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hub Bible" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Hub Bible — Bíblia e Ministério</title>
    <script>
      // Aplica o tema antes da primeira pintura para evitar "flash" de tela clara.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('hub-bible:appearance') || '{}');
          var theme = s.theme || 'system';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          document.documentElement.dataset.theme = resolved;
          if (s.fontScale) document.documentElement.style.setProperty('--reader-scale', s.fontScale);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-mark">HB</div>
        <p>Carregando…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
