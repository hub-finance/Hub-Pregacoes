# Gera o APK do Hub Bible.
#
# Existe porque o app precisa rodar com armazenamento próprio, fora da área do
# Chrome: instalado pelo navegador, limpar os dados do Chrome apaga anos de
# sermões. Aqui o Capacitor empacota o mesmo app numa WebView com dados
# próprios do aplicativo.
#
# A compilação acontece aqui, e não na máquina de ninguém, porque o runner do
# GitHub já vem com o SDK do Android instalado. Ao terminar, o APK fica anexado
# à execução: Actions › a execução › Artifacts › hub-bible-apk.
name: APK Android

on:
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    tags: ['v*'] # publicar uma tag v1.2.3 também gera o APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hub-bible/package-lock.json

      - name: Instalar dependências
        working-directory: hub-bible
        run: npm ci

      - name: Compilar o app web
        working-directory: hub-bible
        run: npm run build

      # O service worker não entra no APK. Dentro do aplicativo ele não tem
      # função — os arquivos já vêm no pacote — e o cache dele sobrevive à
      # atualização, fazendo uma versão nova continuar mostrando telas antigas.
      # Sem `sw.js` no pacote, um service worker que tenha sobrado de uma
      # instalação anterior recebe 404 na verificação e o próprio sistema o
      # remove.
      - name: Tirar o service worker do pacote Android
        working-directory: hub-bible
        run: rm -f dist/sw.js dist/workbox-*.js dist/registerSW.js

      # copia dist/ para dentro do projeto Android; é o passo que o .gitignore
      # dispensa de versionar
      - name: Sincronizar com o projeto Android
        working-directory: hub-bible
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `HUB_BUILD` vira o versionCode. Sem ele todo APK saía como versão 1, e o
      # Android recusa instalar por cima quando o número não sobe — era por isso
      # que consertos entregues aqui não chegavam ao aparelho.
      - name: Gerar o APK
        working-directory: hub-bible/android
        env:
          HUB_BUILD: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Assinado com a chave fixa em `android/keystore/`, e não com a chave de
      # depuração: o runner começa limpo a cada execução e criaria uma chave
      # diferente toda vez, o que faz o Android rejeitar a atualização.
      # Conferência, não portão: se o comando não existir na máquina, a
      # compilação não deve falhar por causa do relatório.
      - name: Conferir a assinatura
        continue-on-error: true
        working-directory: hub-bible/android
        run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk

      - name: Anexar o APK à execução
        uses: actions/upload-artifact@v4
        with:
          name: hub-bible-apk-v${{ github.run_number }}
          path: hub-bible/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
