# Gera o APK do Hub Bible.
#
# Existe porque o app precisa rodar com armazenamento próprio, fora da área do
# Chrome: instalado pelo navegador, limpar os dados do Chrome apaga anos de
# sermões. Aqui o Capacitor empacota o mesmo app numa WebView com dados
# próprios do aplicativo.
#
# A compilação acontece aqui, e não na máquina de ninguém, porque o runner do
# GitHub já vem com o SDK do Android instalado. Ao terminar, o APK sai como
# versão (Release) do repositório, em arquivo .apk direto, sem zip:
# https://github.com/hub-finance/Hub-Pregacoes/releases/latest/download/farol-da-palavra.apk
# Também fica anexado à execução (Actions › a execução › Artifacts), em zip.
name: APK Android

on:
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    tags: ['v*'] # publicar uma tag v1.2.3 também gera o APK

jobs:
  build:
    runs-on: ubuntu-latest
    # publicar a versão (Release) com o APK
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hub-bible/package-lock.json

      - name: Instalar dependências
        working-directory: hub-bible
        run: npm ci

      # O mesmo `HUB_BUILD` do versionCode entra no app web, que o mostra em
      # Configurações › Sobre: é assim que se confere no aparelho se a versão
      # instalada é a nova.
      - name: Compilar o app web
        working-directory: hub-bible
        env:
          HUB_BUILD: ${{ github.run_number }}
        run: npm run build

      # O service worker não entra no APK. Dentro do aplicativo ele não tem
      # função — os arquivos já vêm no pacote — e o cache dele sobrevive à
      # atualização, fazendo uma versão nova continuar mostrando telas antigas.
      # Sem `sw.js` no pacote, um service worker que tenha sobrado de uma
      # instalação anterior recebe 404 na verificação e o próprio sistema o
      # remove.
      - name: Tirar o service worker do pacote Android
        working-directory: hub-bible
        run: rm -f dist/sw.js dist/workbox-*.js dist/registerSW.js

      # copia dist/ para dentro do projeto Android; é o passo que o .gitignore
      # dispensa de versionar
      - name: Sincronizar com o projeto Android
        working-directory: hub-bible
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `HUB_BUILD` vira o versionCode. Sem ele todo APK saía como versão 1, e o
      # Android recusa instalar por cima quando o número não sobe — era por isso
      # que consertos entregues aqui não chegavam ao aparelho.
      - name: Gerar o APK
        working-directory: hub-bible/android
        env:
          HUB_BUILD: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Assinado com a chave fixa em `android/keystore/`, e não com a chave de
      # depuração: o runner começa limpo a cada execução e criaria uma chave
      # diferente toda vez, o que faz o Android rejeitar a atualização.
      # Conferência, não portão: se o comando não existir na máquina, a
      # compilação não deve falhar por causa do relatório.
      - name: Conferir a assinatura
        continue-on-error: true
        working-directory: hub-bible/android
        run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar o APK da edição completa
        run: |
          mkdir -p saida
          cp hub-bible/android/app/build/outputs/apk/debug/app-debug.apk saida/farol-da-palavra.apk

      # Edição 2.0: o mesmo código, sem Rhema e sem Escola de Ministros
      # (`HUB_EDITION=reduzida`). Outro identificador no Android
      # (`app.hubbible.leitor.v2`): instala ao lado da completa e nunca por
      # cima dela. Só APK — o site continua sendo a edição completa.
      - name: Compilar o app web (edição 2.0)
        working-directory: hub-bible
        env:
          HUB_BUILD: ${{ github.run_number }}
          HUB_EDITION: reduzida
        run: |
          npm run build
          rm -f dist/sw.js dist/workbox-*.js dist/registerSW.js
          npx cap sync android

      - name: Gerar o APK (edição 2.0)
        working-directory: hub-bible/android
        env:
          HUB_BUILD: ${{ github.run_number }}
          HUB_EDITION: reduzida
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../saida/farol-da-palavra-2.0.apk

      - name: Anexar os APKs à execução
        uses: actions/upload-artifact@v4
        with:
          name: hub-bible-apk-v${{ github.run_number }}
          path: saida/*.apk
          if-no-files-found: error
          retention-days: 90

      # O zip do Artifacts não abria no extrator de alguns tablets, e baixar dali
      # exige estar logado no GitHub. A versão (Release) entrega o .apk direto:
      # toca e instala. Os nomes dos arquivos são sempre os mesmos — o link de
      # "última versão" nunca muda, e o aviso de atualização do app procura o
      # arquivo da própria edição pelo nome.
      - name: Publicar o APK como versão (Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.run_number }}
        run: |
          gh release create "apk-v$N" saida/farol-da-palavra.apk saida/farol-da-palavra-2.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Farol da Palavra — APK $N" \
            --notes "farol-da-palavra.apk: a edição completa (1.0.$N). farol-da-palavra-2.0.apk: a edição 2.0, sem Rhema e Escola de Ministros (2.0.$N). Cada uma se atualiza só para a própria edição." \
            --latest
